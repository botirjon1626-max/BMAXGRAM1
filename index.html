<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BMAXGRAM</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#0b141a;
    color:#fff;
    height:100vh;
    overflow:hidden;
}

button{
    border:0;
    cursor:pointer;
}

input{
    outline:none;
}

.app{
    height:100vh;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:350px;
    background:#111b21;
    border-right:1px solid #27343b;
    display:flex;
    flex-direction:column;
}

.logo{
    height:65px;
    display:flex;
    align-items:center;
    padding:0 20px;
    font-size:25px;
    font-weight:bold;
    color:#35d9a1;
}

.search{
    padding:10px;
}

.search input{
    width:100%;
    background:#202c33;
    border:0;
    border-radius:10px;
    padding:12px 15px;
    color:white;
}

.tabs{
    display:flex;
    border-bottom:1px solid #27343b;
}

.tabs button{
    flex:1;
    padding:14px 5px;
    background:transparent;
    color:#9baab1;
    font-size:14px;
}

.tabs button.active{
    color:#35d9a1;
    border-bottom:2px solid #35d9a1;
}

.list{
    flex:1;
    overflow-y:auto;
}

.item{
    display:flex;
    align-items:center;
    padding:12px;
    gap:12px;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,.03);
}

.item:hover{
    background:#202c33;
}

.avatar{
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:50%;
    background:#33434c;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.item-text{
    min-width:0;
}

.item-name{
    font-size:16px;
    margin-bottom:4px;
}

.item-sub{
    color:#8c9aa1;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* CHAT */

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    background:#0b141a;
}

.chat-header{
    height:65px;
    background:#202c33;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:12px;
}

.header-info{
    flex:1;
}

.header-name{
    font-size:16px;
    font-weight:bold;
}

.header-status{
    font-size:12px;
    color:#9baab1;
    margin-top:3px;
}

.header-btn{
    background:transparent;
    color:white;
    font-size:21px;
    padding:8px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    background:
      radial-gradient(
        circle at center,
        #17242b 0,
        #0b141a 70%
      );
}

.empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#819099;
    text-align:center;
}

.message{
    max-width:75%;
    margin-bottom:8px;
    padding:9px 12px;
    border-radius:10px;
    background:#202c33;
    width:max-content;
}

.message.mine{
    margin-left:auto;
    background:#075e54;
}

.message-name{
    color:#35d9a1;
    font-size:12px;
    margin-bottom:4px;
}

.message-time{
    color:#9baab1;
    font-size:10px;
    text-align:right;
    margin-top:4px;
}

.message audio{
    max-width:250px;
}

.composer{
    min-height:65px;
    background:#202c33;
    display:flex;
    align-items:center;
    padding:10px;
    gap:8px;
}

.composer input{
    flex:1;
    background:#2a3942;
    color:white;
    border:0;
    border-radius:10px;
    padding:13px 15px;
}

.circle-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#35d9a1;
    color:#06120f;
    font-size:20px;
}

/* LOGIN */

.login-screen{
    position:fixed;
    inset:0;
    background:#0b141a;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:390px;
    background:#111b21;
    border:1px solid #26353d;
    border-radius:18px;
    padding:30px;
    box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.login-box h1{
    text-align:center;
    color:#35d9a1;
    margin-bottom:8px;
}

.login-box p{
    text-align:center;
    color:#8c9aa1;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:14px;
    background:#202c33;
    color:white;
    border:1px solid #34444d;
    border-radius:10px;
    margin-bottom:12px;
}

.primary{
    width:100%;
    padding:14px;
    background:#35d9a1;
    color:#07130f;
    border-radius:10px;
    font-weight:bold;
}

.code-box{
    margin-top:15px;
    text-align:center;
    background:#17252c;
    padding:15px;
    border-radius:10px;
    display:none;
}

.code{
    color:#35d9a1;
    font-size:28px;
    font-weight:bold;
    letter-spacing:5px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:430px;
    max-height:90vh;
    overflow-y:auto;
    background:#111b21;
    border-radius:16px;
    padding:22px;
}

.modal-box h2{
    margin-bottom:18px;
}

.modal-box input,
.modal-box textarea{
    width:100%;
    background:#202c33;
    color:white;
    border:1px solid #34444d;
    border-radius:9px;
    padding:12px;
    margin-bottom:10px;
}

.modal-box textarea{
    resize:none;
    height:90px;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.modal-actions button{
    flex:1;
    padding:12px;
    border-radius:9px;
}

.cancel{
    background:#27343b;
    color:white;
}

.contact-choice{
    background:#202c33;
    padding:10px;
    border-radius:8px;
    margin:5px 0;
    display:flex;
    align-items:center;
    gap:10px;
}

.contact-choice input{
    width:auto;
    margin:0;
}

.group-members{
    max-height:200px;
    overflow-y:auto;
    margin:10px 0;
}

.profile-avatar{
    width:90px;
    height:90px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#33434c;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:30px;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hidden{
    display:none!important;
}

.mobile-menu{
    display:none;
}

@media(max-width:750px){

    .sidebar{
        width:100%;
    }

    .chat{
        display:none;
    }

    .sidebar.chat-open{
        display:none;
    }

    .chat.mobile-show{
        display:flex;
        position:fixed;
        inset:0;
        z-index:20;
    }

    .mobile-menu{
        display:block;
    }
}

@media(min-width:751px){
    #backBtn{
        display:none;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-screen" id="loginScreen">

    <div class="login-box">

        <h1>BMAXGRAM</h1>

        <p>
            Telefon raqamingiz bilan kiring
        </p>

        <input
            id="phoneInput"
            type="tel"
            placeholder="+998901234567"
        >

        <button
            class="primary"
            id="requestCodeBtn"
            onclick="requestCode()"
        >
            Kod olish
        </button>

        <div
            class="code-box"
            id="codeBox"
        >
            <div>Test tasdiqlash kodi:</div>
            <div
                class="code"
                id="randomCode"
            ></div>
        </div>

        <input
            id="codeInput"
            class="hidden"
            type="number"
            placeholder="6 xonali kod"
        >

        <button
            class="primary hidden"
            id="loginBtn"
            onclick="login()"
        >
            Kirish
        </button>

        <div
            id="loginError"
            style="
              color:#ff7777;
              text-align:center;
              margin-top:12px;
            "
        ></div>

    </div>
</div>


<!-- APP -->

<div
    class="app"
    id="app"
>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            BMAXGRAM
        </div>

        <div class="search">

            <input
                id="searchInput"
                placeholder="Qidirish..."
                oninput="filterItems()"
            >

        </div>

        <div class="tabs">

            <button
                id="contactsTab"
                class="active"
                onclick="showTab('contacts')"
            >
                Kontaktlar
            </button>

            <button
                id="groupsTab"
                onclick="showTab('groups')"
            >
                Guruhlar
            </button>

            <button
                onclick="openProfile()"
            >
                Profil
            </button>

        </div>

        <div class="list" id="list"></div>

        <div style="padding:10px">

            <button
                class="primary"
                onclick="openAddContact()"
            >
                ＋ Kontakt qo'shish
            </button>

            <button
                class="primary"
                style="margin-top:8px"
                onclick="openCreateGroup()"
            >
                ＋ Guruh yaratish
            </button>

        </div>

    </aside>


    <!-- CHAT -->

    <main
        class="chat"
        id="chat"
    >

        <div class="chat-header">

            <button
                class="header-btn mobile-menu"
                id="backBtn"
                onclick="closeChat()"
            >
                ←
            </button>

            <div
                class="avatar"
                id="chatAvatar"
            >
                ?
            </div>

            <div class="header-info">

                <div
                    class="header-name"
                    id="chatName"
                >
                    BMAXGRAM
                </div>

                <div
                    class="header-status"
                    id="chatStatus"
                >
                    Chat tanlang
                </div>

            </div>

            <button
                class="header-btn"
                id="groupAddBtn"
                onclick="openAddMember()"
                style="display:none"
            >
                ＋
            </button>

        </div>


        <div
            class="messages"
            id="messages"
        >

            <div class="empty">
                <div>
                    <h2>BMAXGRAM</h2>
                    <p>
                        Kontakt yoki guruhni tanlang
                    </p>
                </div>
            </div>

        </div>


        <div class="composer">

            <button
                class="header-btn"
                onclick="document.getElementById('audioFile').click()"
                title="Ovozli xabar"
            >
                🎤
            </button>

            <input
                id="messageInput"
                placeholder="Xabar yozing..."
                onkeydown="messageKey(event)"
            >

            <button
                class="circle-btn"
                onclick="sendText()"
            >
                ➤
            </button>

            <input
                id="audioFile"
                type="file"
                accept="audio/*"
                capture
                class="hidden"
                onchange="sendVoice(this)"
            >

        </div>

    </main>

</div>


<!-- ADD CONTACT -->

<div
    class="modal"
    id="contactModal"
>

    <div class="modal-box">

        <h2>Kontakt qo'shish</h2>

        <input
            id="contactPhone"
            type="tel"
            placeholder="Telefon raqami"
        >

        <input
            id="contactName"
            placeholder="Ism"
        >

        <div class="modal-actions">

            <button
                class="cancel"
                onclick="closeModal('contactModal')"
            >
                Bekor qilish
            </button>

            <button
                class="primary"
                onclick="addContact()"
            >
                Saqlash
            </button>

        </div>

        <div
            id="contactError"
            style="color:#ff7777;margin-top:10px"
        ></div>

    </div>

</div>


<!-- CREATE GROUP -->

<div
    class="modal"
    id="groupModal"
>

    <div class="modal-box">

        <h2>Guruh yaratish</h2>

        <input
            id="groupName"
            placeholder="Guruh nomi"
        >

        <input
            id="groupAvatar"
            placeholder="Rasm URL (ixtiyoriy)"
        >

        <div>
            Guruhga qo'shiladigan kontaktlar:
        </div>

        <div
            class="group-members"
            id="groupContactList"
        ></div>

        <div class="modal-actions">

            <button
                class="cancel"
                onclick="closeModal('groupModal')"
            >
                Bekor qilish
            </button>

            <button
                class="primary"
                onclick="createGroup()"
            >
                Guruh yaratish
            </button>

        </div>

        <div
            id="groupError"
            style="color:#ff7777;margin-top:10px"
        ></div>

    </div>

</div>


<!-- ADD MEMBER -->

<div
    class="modal"
    id="memberModal"
>

    <div class="modal-box">

        <h2>Guruhga odam qo'shish</h2>

        <div
            id="memberContactList"
        ></div>

        <input
            id="memberPhone"
            type="tel"
            placeholder="Yoki telefon raqamini yozing"
        >

        <div class="modal-actions">

            <button
                class="cancel"
                onclick="closeModal('memberModal')"
            >
                Bekor qilish
            </button>

            <button
                class="primary"
                onclick="addMember()"
            >
                Qo'shish
            </button>

        </div>

        <div
            id="memberError"
            style="color:#ff7777;margin-top:10px"
        ></div>

    </div>

</div>


<!-- PROFILE -->

<div
    class="modal"
    id="profileModal"
>

    <div class="modal-box">

        <h2>Profil</h2>

        <div
            class="profile-avatar"
            id="profileAvatar"
        >
            ?
        </div>

        <input
            id="profileName"
            placeholder="Ism"
        >

        <textarea
            id="profileBio"
            placeholder="O'zingiz haqingizda..."
        ></textarea>

        <input
            id="profileAvatarUrl"
            placeholder="Rasm URL"
        >

        <div class="modal-actions">

            <button
                class="cancel"
                onclick="closeModal('profileModal')"
            >
                Yopish
            </button>

            <button
                class="primary"
                onclick="saveProfile()"
            >
                Saqlash
            </button>

        </div>

        <button
            class="primary"
            style="
              margin-top:10px;
              background:#d9534f;
              color:white;
            "
            onclick="logout()"
        >
            Chiqish
        </button>

        <div
            id="profileError"
            style="color:#ff7777;margin-top:10px"
        ></div>

    </div>

</div>


<script>

/* =========================================================
   GLOBAL
========================================================= */

let currentUser = null;

let currentChat = null;

let contactsData = [];

let groupsData = [];

let currentTab = "contacts";


/* =========================================================
   API
========================================================= */

async function api(
    url,
    options = {}
){

    const response =
        await fetch(
            url,
            {
                credentials:"same-origin",
                ...options,
                headers:{
                    "Content-Type":
                        "application/json",
                    ...(options.headers || {})
                }
            }
        );

    let data;

    try{
        data =
            await response.json();
    }
    catch{
        data = {
            success:false,
            message:
                "Server javobi noto'g'ri"
        };
    }

    if(!response.ok){

        throw new Error(
            data.message ||
            "Xatolik"
        );
    }

    return data;
}


/* =========================================================
   INIT
========================================================= */

async function init(){

    try{

        const data =
            await api(
                "/api/me"
            );

        currentUser =
            data.user;

        document
            .getElementById(
                "loginScreen"
            )
            .classList.add(
                "hidden"
            );

        await loadContacts();

        await loadGroups();

    }
    catch{

        document
            .getElementById(
                "loginScreen"
            )
            .classList.remove(
                "hidden"
            );

    }
}


/* =========================================================
   RANDOM CODE
========================================================= */

async function requestCode(){

    const phone =
        document
        .getElementById(
            "phoneInput"
        )
        .value
        .trim();

    const error =
        document
        .getElementById(
            "loginError"
        );

    error.textContent = "";

    if(!phone){

        error.textContent =
            "Telefon raqam kiriting";

        return;
    }

    try{

        const data =
            await api(
                "/api/request_code",
                {
                    method:"POST",
                    body:
                        JSON.stringify({
                            phone:phone
                        })
                }
            );

        document
            .getElementById(
                "codeBox"
            )
            .style.display =
                "block";

        document
            .getElementById(
                "randomCode"
            )
            .textContent =
                data.code;

        document
            .getElementById(
                "codeInput"
            )
            .classList.remove(
                "hidden"
            );

        document
            .getElementById(
                "loginBtn"
            )
            .classList.remove(
                "hidden"
            );

    }
    catch(e){

        error.textContent =
            e.message;

    }
}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

    const phone =
        document
        .getElementById(
            "phoneInput"
        )
        .value
        .trim();

    const code =
        document
        .getElementById(
            "codeInput"
        )
        .value
        .trim();

    const error =
        document
        .getElementById(
            "loginError"
        );

    error.textContent = "";

    try{

        const data =
            await api(
                "/api/login",
                {
                    method:"POST",
                    body:
                        JSON.stringify({
                            phone:phone,
                            code:code
                        })
                }
            );

        currentUser =
            data.user;

        document
            .getElementById(
                "loginScreen"
            )
            .classList.add(
                "hidden"
            );

        await loadContacts();

        await loadGroups();

    }
    catch(e){

        error.textContent =
            e.message;

    }
}


/* =========================================================
   TABS
========================================================= */

function showTab(tab){

    currentTab = tab;

    document
        .getElementById(
            "contactsTab"
        )
        .classList.toggle(
            "active",
            tab === "contacts"
        );

    document
        .getElementById(
            "groupsTab"
        )
        .classList.toggle(
            "active",
            tab === "groups"
        );

    renderList();
}


/* =========================================================
   CONTACTS
========================================================= */

async function loadContacts(){

    try{

        contactsData =
            await api(
                "/api/contacts"
            );

        if(
            currentTab === "contacts"
        ){
            renderList();
        }

    }
    catch(e){

        console.error(e);

    }
}


/* =========================================================
   GROUPS
========================================================= */

async function loadGroups(){

    try{

        groupsData =
            await api(
                "/api/groups"
            );

        if(
            currentTab === "groups"
        ){
            renderList();
        }

    }
    catch(e){

        console.error(e);

    }
}


/* =========================================================
   LIST
========================================================= */

function renderList(){

    const list =
        document
        .getElementById(
            "list"
        );

    const search =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .toLowerCase();

    list.innerHTML = "";

    let data =
        currentTab === "contacts"
        ? contactsData
        : groupsData;

    data =
        data.filter(
            item => {

                const name =
                    (
                        item.name ||
                        ""
                    ).toLowerCase();

                return name.includes(
                    search
                );

            }
        );

    if(!data.length){

        list.innerHTML =
            `
            <div style="
                text-align:center;
                color:#819099;
                padding:30px 10px;
            ">
                ${
                    currentTab === "contacts"
                    ? "Kontaktlar yo'q"
                    : "Guruhlar yo'q"
                }
            </div>
            `;

        return;
    }

    data.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "item";

            div.onclick =
                () => {

                    if(
                        currentTab ===
                        "contacts"
                    ){

                        openPrivateChat(
                            item
                        );

                    }
                    else{

                        openGroupChat(
                            item
                        );

                    }

                };

            const avatar =
                item.avatar
                ?
                `
                <div class="avatar">
                    <img src="${escapeHtml(item.avatar)}">
                </div>
                `
                :
                `
                <div class="avatar">
                    ${initial(
                        item.name
                    )}
                </div>
                `;

            div.innerHTML =
                `
                ${avatar}

                <div class="item-text">

                    <div class="item-name">
                        ${escapeHtml(
                            item.name ||
                            item.phone
                        )}
                    </div>

                    <div class="item-sub">
                        ${
                            currentTab ===
                            "groups"
                            ?
                            (
                              (item.member_count || 0)
                              + " ta a'zo"
                            )
                            :
                            (
                              item.phone || ""
                            )
                        }
                    </div>

                </div>
                `;

            list.appendChild(
                div
            );

        }
    );
}


/* =========================================================
   SEARCH
========================================================= */

function filterItems(){

    renderList();

}


/* =========================================================
   PRIVATE CHAT
========================================================= */

function openPrivateChat(
    contact
){

    currentChat = {

        type:"private",

        id:
            contact.phone,

        name:
            contact.name ||
            contact.phone,

        avatar:
            contact.avatar || ""

    };

    document
        .getElementById(
            "chatName"
        )
        .textContent =
            currentChat.name;

    document
        .getElementById(
            "chatStatus"
        )
        .textContent =
            contact.phone;

    setAvatar(
        "chatAvatar",

/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

    if(!currentChat)
        return;

    try{

        const data =
            await api(
                "/api/messages?chat_type="
                +
                encodeURIComponent(
                    currentChat.type
                )
                +
                "&chat_id="
                +
                encodeURIComponent(
                    currentChat.id
                )
            );

        renderMessages(
            data
        );

    }
    catch(e){

        console.error(e);

    }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(
    data
){

    const box =
        document
        .getElementById(
            "messages"
        );

    if(!data.length){

        box.innerHTML =
            `
            <div class="empty">
                Hozircha xabar yo'q
            </div>
            `;

        return;
    }

    box.innerHTML = "";

    data.forEach(
        message => {

            const mine =
                message.sender_phone ===
                currentUser.phone;

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "message"
                +
                (
                    mine
                    ? " mine"
                    : ""
                );

            let content = "";

            if(
                currentChat.type ===
                "group"
                &&
                !mine
            ){

                content +=
                    `
                    <div class="message-name">
                        ${escapeHtml(
                            message.sender_name ||
                            message.sender_phone
                        )}
                    </div>
                    `;

            }

            if(message.text){

                content +=
                    `
                    <div>
                        ${escapeHtml(
                            message.text
                        )}
                    </div>
                    `;

            }

            if(message.audio){

                content +=
                    `
                    <audio
                        controls
                        src="${escapeHtml(
                            message.audio
                        )}"
                    ></audio>
                    `;

            }

            content +=
                `
                <div class="message-time">
                    ${formatTime(
                        message.created_at
                    )}
                </div>
                `;

            div.innerHTML =
                content;

            box.appendChild(
                div
            );

        }
    );

    box.scrollTop =
        box.scrollHeight;
}


/* =========================================================

========================================================= */

async function sendText(){

        return;

    const input =
        document
        .getElementById(

    const text =
        input.value.trim();

    if(!text)
        return;

    try{

        await api(
            "/api/messages",
            {
                method:"POST",
                body:
                    JSON.stringify({
                        chat_type:
                            currentChat.type,

                        chat_id:
                            currentChat.id,

                        text:text
                    })
            }
        );

        input.value = "";

        await loadMessages();

    }
    catch(e){

        alert(
            e.message
        );

    }
}


/* =========================================================
   ENTER
========================================================= */

function messageKey(
    event
){

    if(
        event.key ===
        "Enter"
    ){

        event.preventDefault();

        sendText();

    }
}


/* =========================================================
   VOICE
========================================================= */

async function sendVoice(
    input
){

    if(
        !input.files ||
        !input.files[0] ||
        !currentChat
    ){

        return;
    }

    const form =
        new FormData();

    form.append(
        "audio",
        input.files[0]
    );

    form.append(
        "chat_type",
        currentChat.type
    );

    form.append(
        "chat_id",
        currentChat.id
    );

    try{

        const response =
            await fetch(
                "/api/voice",
                {
                    method:"POST",
                    body:form,
                    credentials:
                        "same-origin"
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Ovoz yuborilmadi"
            );

        }

        await loadMessages();

    }
    catch(e){

        alert(
            e.message
        );

    }

    input.value = "";

}

/* =========================================================
   AVATAR
========================================================= */

function setAvatar(
    id,
    image,
    name
){

    const element =
        document
        .getElementById(
            id
        );

    if(!element)
        return;

    if(image){

        element.innerHTML =
            `
            <img
                src="${escapeHtml(
                    image
                )}"
            >
            `;

    }
    else{

        element.textContent =
            initial(name);

    }

}


function initial(
    name
){

    if(!name)
        return "?";

    return name
        .trim()
        .charAt(0)
        .toUpperCase();

}


/* =========================================================
   TIME
========================================================= */

function formatTime(
    value
){

    if(!value)
        return "";

    const date =
        new Date(
            value
        );

    if(
        isNaN(
            date.getTime()
        )
    ){
        return "";
    }

    return date.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
